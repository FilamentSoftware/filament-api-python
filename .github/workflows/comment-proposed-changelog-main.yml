name: Comment Proposed Changelog (main)

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

jobs:
  comment-proposed-changelog:
    uses: ./.github/workflows/comment-proposed-changelog-reusable.yml
    with:
      target-branch: main
      changelog-file: CHANGELOG.md
