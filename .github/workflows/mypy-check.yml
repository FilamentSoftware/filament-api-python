name: MyPy Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - run: poetry self add poetry-plugin-export

      - run: poetry export --without-hashes --with types --format=requirements.txt > requirements-types.txt

      - uses: jpetrucciani/mypy-check@1.19.1
        with:
          path: src
          requirements_file: requirements-types.txt
