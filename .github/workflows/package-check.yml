name: Package Check

# Builds the sdist and wheel and validates their metadata (README rendering,
# license fields, classifiers) so breakage is caught in review rather than by
# the publish jobs in create-release.yml.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build package
        run: poetry build

      - name: Install twine
        run: python -m pip install twine

      - name: Check package metadata
        run: python -m twine check --strict dist/*
