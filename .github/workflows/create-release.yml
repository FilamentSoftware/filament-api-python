name: Create Release

on:
  workflow_run:
    workflows:
      - "Increment Version (develop)"
      - "Increment Version (main)"
    types:
      - completed

jobs:
  resolve-version:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Download version artifact
        uses: actions/download-artifact@v7
        with:
          name: version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Get version
        id: get_version
        run: |
          version=$(cat version.txt | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  build:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.resolve-version.outputs.version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set package version
        run: poetry version "${{ needs.resolve-version.outputs.version }}"

      - name: Set __version__
        run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.resolve-version.outputs.version }}"/' src/filament_api/__init__.py

      - name: Build package
        run: poetry build

      - name: Rename artifacts with Python version
        run: |
          mkdir -p dist/renamed
          for f in dist/*.whl dist/*.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [[ "$base" == *.tar.gz ]]; then
              name="${base%.tar.gz}"
              ext="tar.gz"
            else
              name="${base%.*}"
              ext="${base##*.}"
            fi
            mv "$f" "dist/renamed/${name}-py${{ matrix.python-version }}.${ext}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/renamed/*

  release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.resolve-version.outputs.version }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-py*
          path: dist
          merge-multiple: true

      - name: Extract changelog
        id: extract_changelog
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Determine which changelog to use based on version
          if echo "$VERSION" | grep -q "dev"; then
            file="CHANGELOG_DEV.md"
          else
            file="CHANGELOG.md"
          fi

          if [[ ! -f "$file" ]]; then
            echo "body=Release v$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          content="$(awk '
            BEGIN { in_section=0 }
            /^## / {
              if (in_section) { exit }
              in_section=1
            }
            in_section { print }
          ' "$file")"

          delimiter="EOF_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            echo "$content"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          body: ${{ steps.extract_changelog.outputs.body }}
          prerelease: ${{ contains(needs.resolve-version.outputs.version, 'dev') }}
          files: dist/*
