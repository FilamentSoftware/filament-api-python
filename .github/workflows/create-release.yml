name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set package version from tag
        run: poetry version "${GITHUB_REF_NAME#v}"

      - name: Build package
        run: poetry build

      - name: Rename artifacts with Python version
        run: |
          mkdir -p dist/renamed
          for f in dist/*.whl dist/*.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [[ "$base" == *.tar.gz ]]; then
              name="${base%.tar.gz}"
              ext="tar.gz"
            else
              name="${base%.*}"
              ext="${base##*.}"
            fi
            mv "$f" "dist/renamed/${name}-py${{ matrix.python-version }}.${ext}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/renamed/*

  release:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog
        id: extract_changelog
        shell: bash
        run: |
          # Determine which changelog to use based on tag
          if echo "$GITHUB_REF_NAME" | grep -q "dev"; then
            file="CHANGELOG_DEV.md"
          else
            file="CHANGELOG.md"
          fi

          if [[ ! -f "$file" ]]; then
            echo "body=Release $GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            exit 0
          fi

          content="$(awk '
            BEGIN { in_section=0 }
            /^## / {
              if (in_section) { exit }
              in_section=1
            }
            in_section { print }
          ' "$file")"

          delimiter="EOF_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            echo "$content"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.extract_changelog.outputs.body }}
          prerelease: ${{ contains(github.ref_name, 'dev') }}
          files: dist/*
