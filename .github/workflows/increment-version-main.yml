name: Increment Version (main)

on:
  push:
    branches:
      - main

jobs:
  increment-version:
    uses: ./.github/workflows/increment-version-reusable.yml
    permissions:
      id-token: write
      contents: write
      checks: write
    with:
      changelog-file: CHANGELOG.md
      fetch-depth: 0
    secrets:
      SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
