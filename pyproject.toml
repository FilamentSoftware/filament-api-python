[project]
name = "filament-api"
version = "0.0.0"
description = "Async Python client for the Filament platform, communicating over SignalR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Filament Software"}]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# brotli is required (not an optional extra like crc32c): [CompressedProperty]
# values are decoded automatically on read, so decoding must not depend on
# install choices.
dependencies = ["uuid-utils>=0.9", "pysignalr>=1.3.0", "httpx>=0.27", "brotli>=1.2"]

# CRC32C checksums are only needed when a deployment's file store advertises
# FileChecksumAlgorithm.Crc32cBase64 (GCS). stdlib has no CRC32C, so it is an
# optional extra rather than a hard dependency: install with
# ``pip install filament-api[crc32c]`` when required.
[project.optional-dependencies]
crc32c = ["google-crc32c>=1.5"]

[project.urls]
Homepage = "https://github.com/FilamentSoftware/filament-api-python"
Repository = "https://github.com/FilamentSoftware/filament-api-python"
Documentation = "https://github.com/FilamentSoftware/filament-api-python/blob/main/docs/README.md"
Issues = "https://github.com/FilamentSoftware/filament-api-python/issues"

[build-system]
# >=2.2 for PEP 639 license expressions (license = "MIT", license-files).
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Poetry builds with its bundled poetry-core, so build-system.requires alone
# does not stop an older Poetry from mishandling the PEP 639 license fields.
requires-poetry = ">=2.2"
packages = [
    {include = "filament", from = "src"},
    {include = "filament_mypy_plugin.py", from = "src"},
]

[tool.poetry.group.test.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=1.0"
pytest-cov = ">=6.0"
# Required by tests/test_mypy_plugin.py, which type-checks snippets in-process
# to verify the condition-builder mypy plugin.
mypy = ">=1.0"

[tool.poetry.group.types.dependencies]
mypy = ">=1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["src/filament_mypy_plugin.py"]

[[tool.mypy.overrides]]
module = ["pysignalr", "pysignalr.*"]
ignore_missing_imports = true

# Optional extra (filament-api[crc32c]); no type stubs published.
[[tool.mypy.overrides]]
module = ["google_crc32c"]
ignore_missing_imports = true

# Required dependency; ships no type hints and no stubs package exists.
[[tool.mypy.overrides]]
module = ["brotli"]
ignore_missing_imports = true
