[project]
name = "filament-api"
version = "0.0.0"
description = "Filament Python API"
requires-python = ">=3.10,<4.0"
dependencies = ["uuid-utils>=0.9", "pysignalr>=1.3.0"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    {include = "filament", from = "src"},
    {include = "filament_mypy_plugin.py", from = "src"},
]

[tool.poetry.group.test.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=1.0"
pytest-cov = ">=6.0"

[tool.poetry.group.types.dependencies]
mypy = ">=1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["filament_mypy_plugin"]

[[tool.mypy.overrides]]
module = ["pysignalr", "pysignalr.*"]
ignore_missing_imports = true
